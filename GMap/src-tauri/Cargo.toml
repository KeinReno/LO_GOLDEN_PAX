[package]
name = "gmap"
version = "0.2.0"
description = "GMap — sci-fi star map editor"
authors = ["you"]
edition = "2021"

[lib]
name = "gmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
