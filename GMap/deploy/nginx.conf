# Reverse proxy → gmap:4173
# HTTPS: put fullchain.pem + privkey.pem in deploy/certs/ and uncomment the SSL server block.
# Or follow Let's Encrypt steps in DEPLOY.md.

upstream gmap_upstream {
  server gmap:4173;
  keepalive 16;
}

# ACME challenge (certbot webroot)
server {
  listen 80;
  listen [::]:80;
  server_name _;

  client_max_body_size 32m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_pass http://gmap_upstream;
  }
}

